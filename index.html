<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DevTools Hub - Bộ công cụ phát triển web miễn phí, chạy 100% trên trình duyệt. JSON Formatter, Base64, Regex Tester, Hash Generator và nhiều hơn nữa.">
    <meta name="keywords" content="devtools, developer tools, json formatter, base64, regex tester, hash generator, web tools, công cụ lập trình">
    <meta name="author" content="DevTools Hub">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="DevTools Hub - Công cụ Dev miễn phí">
    <meta property="og:description" content="Tất cả công cụ developer cần, trong một trang duy nhất. 100% offline, bảo mật tuyệt đối.">
    <meta property="og:type" content="website">
    <title>DevTools Hub - Công cụ Dev miễn phí</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="grain-overlay"></div>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">DevTools<span class="logo-accent">Hub</span></span>
            </div>
            <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
                <span></span><span></span><span></span>
            </button>
        </div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Tìm công cụ... (Ctrl+K)" autocomplete="off">
            <kbd class="search-kbd">Ctrl+K</kbd>
        </div>

        <nav class="sidebar-nav" id="sidebar-nav">
            <!-- Categories and tools will be rendered by JS -->
        </nav>

        <div class="sidebar-footer">
            <div class="security-badge">
                <span class="security-icon">🔒</span>
                <span>100% Offline · Bảo mật tuyệt đối</span>
            </div>
            <div class="sidebar-version">v0.0.1</div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content aurora-bg" id="main-content">
        <!-- Welcome Screen -->
        <div class="welcome-screen" id="welcome-screen">
            <div class="welcome-hero">
                <div class="particles-container" id="particles-container"></div>
                <div class="welcome-glow"></div>
                <h1 class="welcome-title gradient-text-animated">
                    <span class="welcome-icon">⚡</span>
                    DevTools<span class="accent">Hub</span>
                </h1>
                <p class="welcome-subtitle">Tất cả công cụ developer cần, trong một trang duy nhất</p>
                <div class="welcome-badges">
                    <span class="badge"><span class="badge-icon">🔒</span> 100% Offline</span>
                    <span class="badge"><span class="badge-icon">⚡</span> Siêu nhanh</span>
                    <span class="badge"><span class="badge-icon">🆓</span> Miễn phí</span>
                    <span class="badge"><span class="badge-icon">🛡️</span> Không thu thập data</span>
                </div>
                <div class="welcome-stats stagger-in">
                    <div class="welcome-stat">
                        <span class="welcome-stat-value" data-count="15">0</span>
                        <span class="welcome-stat-label">Công cụ</span>
                    </div>
                    <div class="welcome-stat">
                        <span class="welcome-stat-value" data-count="0">0</span>
                        <span class="welcome-stat-label">API calls</span>
                    </div>
                    <div class="welcome-stat">
                        <span class="welcome-stat-value" data-count="100">0</span>
                        <span class="welcome-stat-label">% Offline</span>
                    </div>
                </div>
            </div>

            <div class="tools-grid stagger-in" id="tools-grid">
                <!-- Tool cards will be rendered by JS -->
            </div>
        </div>

        <!-- Tool Container -->
        <div class="tool-container" id="tool-container" style="display: none;">
            <div class="tool-breadcrumb" id="tool-breadcrumb"></div>
            <div class="tool-content" id="tool-content">
                <!-- Active tool will render here -->
            </div>
        </div>
    </main>

    <!-- Mobile overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Scripts -->
    <script src="js/effects.js"></script>
    <script src="js/tools/json-formatter.js"></script>
    <script src="js/tools/base64.js"></script>
    <script src="js/tools/url-encoder.js"></script>
    <script src="js/tools/hash-generator.js"></script>
    <script src="js/tools/regex-tester.js"></script>
    <script src="js/tools/color-picker.js"></script>
    <script src="js/tools/lorem-ipsum.js"></script>
    <script src="js/tools/timestamp-converter.js"></script>
    <script src="js/tools/jwt-decoder.js"></script>
    <script src="js/tools/diff-checker.js"></script>
    <script src="js/tools/markdown-preview.js"></script>
    <script src="js/tools/uuid-generator.js"></script>
    <script src="js/tools/text-counter.js"></script>
    <script src="js/tools/css-unit-converter.js"></script>
    <script src="js/tools/number-base-converter.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
